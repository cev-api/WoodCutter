plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

base {
    archivesName = 'woodcutter-fabric'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        woodcutter {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "$buildDir/generated/resources"
        }
    }
}

def recipeSource = project(':common').file('src/main/resources/woodcutter/recipes.csv')
def generatedRecipeDir = file("$buildDir/generated/resources/data/woodcutter/recipes")

tasks.register('generateStonecutterRecipes') {
    inputs.file(recipeSource)
    outputs.dir(generatedRecipeDir)

    doLast {
        delete(generatedRecipeDir)
        generatedRecipeDir.mkdirs()

        recipeSource.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }

            def parts = trimmed.split(',')
            if (parts.length != 4) {
                throw new GradleException("Invalid recipe CSV line: ${line}")
            }

            def key = parts[0].trim()
            def ingredient = parts[1].trim()
            def result = parts[2].trim()
            def count = Integer.parseInt(parts[3].trim())

            def outFile = new File(generatedRecipeDir, "${key}.json")
            outFile.text = """{
  \"type\": \"minecraft:stonecutting\",
  \"ingredient\": {
    \"item\": \"minecraft:${ingredient}\"
  },
  \"result\": {
    \"id\": \"minecraft:${result}\",
    \"count\": ${count}
  }
}
"""
        }
    }
}

tasks.processResources {
    dependsOn(tasks.named('generateStonecutterRecipes'))
}

tasks.named('sourcesJar') {
    dependsOn(tasks.named('generateStonecutterRecipes'))
}
